<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1d3b">
  <title>Reset password · EVENTORA</title>
  <link rel="stylesheet" href="admin.css">
  <script src="config.js"></script>
  <script type="module" src="reset-password.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="mark">E</span><span>EVENTORA</span></a>
    <span class="top-label">ACCOUNT RECOVERY</span>
    <a class="back-link" href="admin.html">Organizer login ↗</a>
  </header>
  <main class="shell">
    <section class="intro">
      <p class="eyebrow">SECURE ACCOUNT RECOVERY</p>
      <h1>Set a new password</h1>
      <p>Use this page after opening the latest password recovery email sent by EVENTORA.</p>
    </section>
    <div id="resetMessage" class="notice" role="status" aria-live="polite">Checking your recovery link…</div>
    <section id="resetPanel" class="panel login-panel" hidden>
      <form id="resetForm" class="form">
        <label for="newPassword">New password
          <input id="newPassword" type="password" autocomplete="new-password" minlength="10" required>
        </label>
        <label for="confirmPassword">Confirm new password
          <input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" required>
        </label>
        <button id="savePassword" class="button primary" type="submit">Update password</button>
      </form>
    </section>
    <p class="muted">Never share your password or recovery link with anyone.</p>
  </main>
</body>
</html>
