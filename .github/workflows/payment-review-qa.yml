name: Payment Review QA

on:
  push:
    branches:
      - qa/payment-review-isolated
  pull_request:
    branches:
      - main
    paths:
      - "admin.js"
      - "index.html"
      - "script.js"
      - "supabase/payment_verification_v1.sql"
      - "tests/**"
      - ".github/workflows/payment-review-qa.yml"

permissions:
  contents: read

jobs:
  payment-review-source-checks:
    name: Payment review source checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run isolated source checks
        run: node tests/payment-review-source-checks.mjs
      - name: Run offline behavior-model tests
        run: node tests/payment-review-behavior-model.mjs
      - name: Run SQL security contract checks
        run: node tests/payment-review-sql-contract-checks.mjs
      - name: Run registration/payment integration contract checks
        run: node tests/registration-payment-integration-contracts.mjs
      - name: Run public event site content checks
        run: node tests/public-site-content-checks.mjs
